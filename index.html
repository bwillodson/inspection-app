<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspector Fix V25</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; }
        .btn { background: #27ae60; color: white; padding: 15px; border: none; width: 100%; font-weight: bold; cursor: pointer; border-radius: 5px; }
        #reportArea { display: none; background: #fff; padding: 20px; border: 5px solid #3498db; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Inspection Entry</h2>
        <input type="text" id="c_name" placeholder="Client Name">
        <input type="text" id="p_addr" placeholder="Address">
        <button class="btn" onclick="runReport()">🛠 GENERATE REPORT</button>
    </div>

    <div id="reportArea">
        <h1 id="out_name"></h1>
        <p id="out_addr"></p>
        <p><strong>Status:</strong> Report Generated Successfully!</p>
        <button onclick="window.print()" style="padding:10px;">Save as PDF</button>
        <button onclick="location.reload()" style="padding:10px;">Start New</button>
    </div>

    <script>
        function runReport() {
            // 1. Get the data
            const name = document.getElementById('c_name').value || "No Name Entered";
            const addr = document.getElementById('p_addr').value || "No Address Entered";

            // 2. Put data into the report
            document.getElementById('out_name').innerText = "Summary for: " + name;
            document.getElementById('out_addr').innerText = "Property: " + addr;

            // 3. Show the report
            document.getElementById('reportArea').style.display = 'block';

            // 4. Scroll to it
            window.scrollTo(0, document.body.scrollHeight);
            
            // 5. Alert just to be sure
            alert("Report Created for " + name);
        }
    </script>
</body>
</html>
