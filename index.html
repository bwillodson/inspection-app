<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inspect Pro V24</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --bg: #f4f7f6; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--primary); padding: 15px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        .sig-wrapper { background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; touch-action: none; margin: 10px 0; }
        canvas { width: 100%; height: 150px; }
        .btn { border: none; padding: 18px; border-radius: 8px; font-weight: bold; width: 100%; color: white; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .btn-gen { background: var(--success); }
        #reportArea { display: none; background: white; padding: 25px; border-radius: 12px; margin-top: 20px; border: 3px solid var(--success); }
    </style>
</head>
<body>

    <div class="card">
        <h2>1. Project Info</h2>
        <input type="text" id="c_name" placeholder="Client Name">
        <input type="text" id="p_addr" placeholder="Property Address">
        
        <h2>2. Findings</h2>
        <select id="elec_stat">
            <option value="Satisfactory">Electrical: Satisfactory</option>
            <option value="Action Required">Electrical: Action Required</option>
        </select>
    </div>

    <div class="card">
        <h2>3. Signatures</h2>
        <div class="sig-wrapper"><canvas id="sig-insp"></canvas></div>
        <button class="btn" style="background:#95a5a6; padding:5px;" onclick="clearSig('sig-insp')">Clear Insp</button>
        
        <div class="sig-wrapper" style="margin-top:20px;"><canvas id="sig-cli"></canvas></div>
        <button class="btn" style="background:#95a5a6; padding:5px;" onclick="clearSig('sig-cli')">Clear Client</button>
    </div>

    <button class="btn btn-gen" onclick="generateReport()">🛠 GENERATE REPORT</button>

    <div id="reportArea">
        <div id="out"></div>
        <button class="btn" style="background:var(--primary)" onclick="window.print()">🖨 PRINT / SAVE PDF</button>
    </div>

    <script>
        // Setup Canvas
        function initSig(id) {
            const canvas = document.getElementById(id);
            const ctx = canvas.getContext("2d");
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            let drawing = false;
            const getPos = (e) => {
                const r = canvas.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
                return {x, y};
            };
            canvas.addEventListener("touchstart", (e) => { e.preventDefault(); drawing = true; ctx.beginPath(); ctx.moveTo(getPos(e).x, getPos(e).y); });
            canvas.addEventListener("touchmove", (e) => { e.preventDefault(); if(drawing) { ctx.lineTo(getPos(e).x, getPos(e).y); ctx.stroke(); } });
            window.addEventListener("touchend", () => drawing = false);
        }

        initSig("sig-insp");
        initSig("sig-cli");

        function clearSig(id) {
            const c = document.getElementById(id);
            c.getContext("2d").clearRect(0,0,c.width,c.height);
        }

        function generateReport() {
            // Test alert to confirm button is working
            console.log("Button clicked");
            
            const name = document.getElementById('c_name').value || "Client";
            const addr = document.getElementById('p_addr').value || "Address";
            const elec = document.getElementById('elec_stat').value;

            document.getElementById('out').innerHTML = `
                <h1 style="text-align:center">Inspection Summary</h1>
                <p><strong>Client:</strong> ${name}</p>
                <p><strong>Address:</strong> ${addr}</p>
                <hr>
                <p><strong>Electrical System:</strong> ${elec}</p>
                <p>Walkthrough complete on ${new Date().toLocaleDateString()}</p>
            `;

            document.getElementById('reportArea').style.display = 'block';
            document.getElementById('reportArea').scrollIntoView({behavior: 'smooth'});
        }
    </script>
</body>
</html>
